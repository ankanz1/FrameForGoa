<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg-forest { fill: #0a532c; }
      .sea-green { fill: #0e693a; }
      .sun-yellow { fill: #ffd000; }
      .sand-white { fill: #ffffff; }
      .house-wall { fill: #ffffff; stroke: #0a532c; stroke-width: 2.5; }
      .roof-green { fill: #106035; stroke: #ffffff; stroke-width: 2.5; }
      .pink-accent { fill: #ff2e8f; }
      .line-white { stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-white-thin { stroke: #ffffff; stroke-width: 2; stroke-linecap: round; fill: none; }
      .ray-yellow { stroke: #ffd000; stroke-width: 3.5; stroke-linecap: round; }
      .trunk-white { stroke: #ffffff; stroke-width: 8; fill: none; stroke-linecap: round; }
      .trunk-yellow { stroke: #ffd000; stroke-width: 3; fill: none; stroke-linecap: round; }
      .leaf-green { fill: #0e693a; stroke: #ffffff; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Solid Green Background (Sky & Upper Half) -->
  <rect width="1000" height="1000" class="bg-forest" />

  <!-- Sun Rays (9 Rays) -->
  <g class="ray-yellow">
    <line x1="500" y1="520" x2="500" y2="440" /> <!-- Center Top -->
    <line x1="450" y1="525" x2="410" y2="485" />
    <line x1="550" y1="525" x2="590" y2="485" />
    <line x1="410" y1="540" x2="360" y2="520" />
    <line x1="590" y1="540" x2="640" y2="520" />
    <line x1="380" y1="575" x2="320" y2="575" />
    <line x1="620" y1="575" x2="680" y2="575" />
  </g>

  <!-- Setting Sun -->
  <path d="M 390 640 A 110 110 0 0 1 610 640 Z" class="sun-yellow" />

  <!-- Distant Green Hills -->
  <path d="M 150 640 Q 250 620 380 640 T 620 640 Q 750 610 880 640 L 1000 640 L 1000 660 L 0 660 L 0 640 Z" fill="#084223" />

  <!-- Sea Layer -->
  <rect x="0" y="640" width="1000" height="140" class="sea-green" />

  <!-- Yellow Sun Reflections on Water -->
  <g fill="#ffd000">
    <rect x="420" y="650" width="160" height="6" rx="3" />
    <rect x="440" y="662" width="120" height="5" rx="2.5" />
    <rect x="460" y="673" width="80" height="4" rx="2" />
    <rect x="475" y="682" width="50" height="3" rx="1.5" />
    <rect x="485" y="690" width="30" height="3" rx="1.5" />
  </g>

  <!-- Small Boat Outline on Horizon Left -->
  <path d="M 180 670 L 220 670 L 210 680 L 190 680 Z" class="line-white-thin" fill="#ffffff" />
  <line x1="200" y1="670" x2="200" y2="660" class="line-white-thin" />

  <!-- Sea Waves -->
  <path d="M 50 710 Q 200 695 350 710 T 650 710 T 950 710" class="line-white-thin" />
  <path d="M 0 740 Q 250 725 500 740 T 1000 740" class="line-white-thin" />

  <!-- White Sand Beach Shoreline -->
  <path d="M 0 760 Q 300 735 500 760 T 1000 750 L 1000 1000 L 0 1000 Z" class="sand-white" />

  <!-- Left Side: Umbrellas & Lounge Chairs -->
  <g>
    <!-- Umbrella 1 -->
    <path d="M 165 750 A 35 35 0 0 1 235 750 Z" class="sun-yellow" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 188 750 A 35 35 0 0 1 212 750 Z" fill="#ffffff" />
    <line x1="200" y1="750" x2="200" y2="800" stroke="#0a532c" stroke-width="3" />

    <!-- Lounge Chairs 1 -->
    <polyline points="175,795 190,785 210,805" stroke="#0a532c" stroke-width="3" fill="none" />
    <polyline points="215,795 230,785 250,805" stroke="#0a532c" stroke-width="3" fill="none" />

    <!-- Umbrella 2 -->
    <path d="M 310 755 A 35 35 0 0 1 380 755 Z" class="sun-yellow" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 333 755 A 35 35 0 0 1 357 755 Z" fill="#ffffff" />
    <line x1="345" y1="755" x2="345" y2="805" stroke="#0a532c" stroke-width="3" />

    <!-- Lounge Chairs 2 -->
    <polyline points="320,805 335,795 360,815" stroke="#0a532c" stroke-width="3" fill="none" />
    <polyline points="365,805 380,795 405,815" stroke="#0a532c" stroke-width="3" fill="none" />
  </g>

  <!-- GOA BEACH Shack (Center Right) -->
  <g>
    <!-- Shack Structure -->
    <rect x="640" y="725" width="150" height="90" rx="6" fill="#0e693a" stroke="#ffffff" stroke-width="3" />
    <!-- Pink GOA BEACH Signboard -->
    <rect x="655" y="740" width="120" height="26" rx="4" class="pink-accent" />
    <text x="715" y="758" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">GOA BEACH</text>

    <!-- Bar Stools -->
    <circle cx="670" cy="820" r="6" fill="#ffffff" />
    <line x1="670" y1="820" x2="670" y2="840" stroke="#0a532c" stroke-width="2.5" />
    <circle cx="695" cy="820" r="6" fill="#ffffff" />
    <line x1="695" y1="820" x2="695" y2="840" stroke="#0a532c" stroke-width="2.5" />
    <circle cx="720" cy="820" r="6" fill="#ffffff" />
    <line x1="720" y1="820" x2="720" y2="840" stroke="#0a532c" stroke-width="2.5" />

    <!-- Surfboards next to shack -->
    <path d="M 570 820 Q 575 750 580 820 Z" fill="#ffffff" stroke="#0a532c" stroke-width="2" />
    <path d="M 595 820 Q 600 745 610 820 Z" fill="#ffd000" stroke="#0a532c" stroke-width="2" />
  </g>

  <!-- Foreground Houses (Bottom Left & Right) -->
  <!-- Left House Group -->
  <g>
    <!-- House 1 -->
    <polygon points="0,880 180,820 200,920 0,980" class="house-wall" />
    <polygon points="0,850 180,790 200,820 0,880" class="roof-green" />
    <!-- Yellow Balcony / Railing -->
    <rect x="10" y="960" width="170" height="15" fill="#ffd000" stroke="#0a532c" stroke-width="2" />

    <!-- House 2 -->
    <polygon points="180,840 400,790 420,910 200,960" class="house-wall" />
    <polygon points="180,820 400,770 410,790 180,840" class="roof-green" />
    <circle cx="260" cy="900" r="12" fill="#0a532c" />
  </g>

  <!-- Right House Group -->
  <g>
    <!-- House 3 -->
    <polygon points="610,850 830,790 850,910 630,970" class="house-wall" />
    <polygon points="610,830 830,770 840,790 610,850" class="roof-green" />
    <!-- Yellow Awning -->
    <polygon points="610,940 680,920 685,935 610,955" fill="#ffd000" stroke="#0a532c" stroke-width="2" />

    <!-- House 4 -->
    <polygon points="810,790 1000,740 1000,900 810,950" class="house-wall" />
    <!-- Pink Shutters -->
    <rect x="840" y="920" width="18" height="40" class="pink-accent" />
    <rect x="900" y="940" width="18" height="40" class="pink-accent" />
  </g>

  <!-- Tall Curved Palm Trees Framing Scene -->
  <!-- Left Big Palm -->
  <g>
    <path d="M 10 1000 Q 30 550 100 510" class="trunk-white" />
    <path d="M 10 1000 Q 30 550 100 510" class="trunk-yellow" />

    <!-- Leaves -->
    <path d="M 100 510 Q -10 470 -40 520 Z" class="leaf-green" />
    <path d="M 100 510 Q 20 420 -10 390 Z" class="leaf-green" />
    <path d="M 100 510 Q 110 410 160 440 Z" class="leaf-green" />
    <path d="M 100 510 Q 170 480 180 540 Z" class="leaf-green" />
  </g>

  <!-- Right Big Palm -->
  <g>
    <path d="M 990 1000 Q 970 550 900 510" class="trunk-white" />
    <path d="M 990 1000 Q 970 550 900 510" class="trunk-yellow" />

    <!-- Leaves -->
    <path d="M 900 510 Q 1010 470 1040 520 Z" class="leaf-green" />
    <path d="M 900 510 Q 980 420 1010 390 Z" class="leaf-green" />
    <path d="M 900 510 Q 890 410 840 440 Z" class="leaf-green" />
    <path d="M 900 510 Q 830 480 820 540 Z" class="leaf-green" />
  </g>

  <!-- Midground Palms -->
  <!-- Mid Left Palm -->
  <g>
    <path d="M 240 870 Q 240 730 280 670" class="trunk-white" stroke-width="6" />
    <path d="M 280 670 Q 200 630 170 670 Z" class="leaf-green" />
    <path d="M 280 670 Q 240 580 220 570 Z" class="leaf-green" />
    <path d="M 280 670 Q 330 580 360 610 Z" class="leaf-green" />
  </g>

  <!-- Mid Right Palm -->
  <g>
    <path d="M 800 840 Q 810 720 780 650" class="trunk-white" stroke-width="6" />
    <path d="M 780 650 Q 850 610 880 650 Z" class="leaf-green" />
    <path d="M 780 650 Q 820 560 800 550 Z" class="leaf-green" />
    <path d="M 780 650 Q 720 570 690 600 Z" class="leaf-green" />
  </g>
</svg>
